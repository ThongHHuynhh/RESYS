<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESYS Configuration Wizard</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #1f2937; }
      .app-shell { max-width: 960px; margin: 0 auto; padding: 24px; }
      .card { background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); padding: 28px; margin-bottom: 24px; }
      .header { margin-bottom: 12px; }
      .header h1 { font-size: 2rem; margin: 0 0 8px; }
      .header p { margin: 0; color: #475569; }
      .question { margin-bottom: 20px; }
      .question-title { font-weight: 700; margin-bottom: 10px; }
      .options { display: grid; gap: 12px; }
      .option-button { padding: 16px 18px; border: 1px solid #cbd5e1; border-radius: 12px; background: #ffffff; cursor: pointer; text-align: left; transition: border-color 0.2s, background 0.2s; }
      .option-button:hover { border-color: #64748b; }
      .option-button.selected { border-color: #2563eb; background: #eff6ff; }
      .option-image { max-height: 80px; margin-top: 10px; border-radius: 8px; object-fit: contain; }
      .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
      .button { border: none; border-radius: 10px; padding: 14px 22px; font-weight: 700; cursor: pointer; }
      .button.primary { background: #2563eb; color: white; }
      .button.secondary { background: #e2e8f0; color: #0f172a; }
      .result-card { padding: 22px; border-radius: 14px; border: 1px solid #e2e8f0; background: #f8fafc; }
      .result-card h2 { margin-top: 0; }
      .status { color: #475569; margin-bottom: 12px; }
      .footer { color: #64748b; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div id="root" class="app-shell"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
