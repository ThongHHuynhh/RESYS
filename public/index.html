<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESYS Configuration Wizard</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #1f2937; }
      .app-shell { max-width: 960px; margin: 0 auto; padding: 24px; }
      .card { background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); padding: 28px; margin-bottom: 24px; }
      .header { margin-bottom: 12px; }
      .header h1 { font-size: 2rem; margin: 0 0 8px; }
      .header p { margin: 0; color: #475569; }
      .question { margin-bottom: 20px; }
      .question-title { font-weight: 700; margin-bottom: 10px; }
      .option-image-grid { display: grid; gap: 12px; margin-bottom: 16px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
      .option-image-card { border: 1px solid #cbd5e1; border-radius: 16px; overflow: hidden; background: white; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
      .option-image-card:hover { border-color: #64748b; }
      .option-image-card.selected { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
      .option-image-card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
      .option-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      .option-button { flex: 1 1 120px; min-width: 120px; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; background: #ffffff; cursor: pointer; text-align: center; transition: border-color 0.2s, background 0.2s; }
      .option-button:hover { border-color: #64748b; }
      .option-button.selected { border-color: #2563eb; background: #eff6ff; }
      .question-image { width: 100%; max-height: 320px; object-fit: cover; border-radius: 16px; margin-bottom: 20px; }
      .question-step { color: #475569; font-size: 0.95rem; margin-bottom: 14px; }
      .nav-buttons { justify-content: space-between; }
      .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
      .button { border: none; border-radius: 10px; padding: 14px 22px; font-weight: 700; cursor: pointer; }
      .button.primary { background: #2563eb; color: white; }
      .button.secondary { background: #e2e8f0; color: #0f172a; }
      .result-banner { width: 100%; min-height: 220px; border-radius: 16px; overflow: hidden; margin-bottom: 20px; display: grid; place-items: center; background: linear-gradient(135deg, #2563eb 0%, #38bdf8 100%); color: white; font-size: 1.1rem; font-weight: 700; text-align: center; }
      .result-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .result-card { padding: 22px; border-radius: 14px; border: 1px solid #e2e8f0; background: #f8fafc; }
      .result-card h2 { margin-top: 0; }
      .status { color: #475569; margin-bottom: 12px; }
      .footer { color: #64748b; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div id="root" class="app-shell"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
